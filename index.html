<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-freight – ULD & NOA register</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101a33">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="e-freight">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ef.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
.land{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.side{background:linear-gradient(160deg,var(--navy1),var(--navy2));color:#fff;padding:40px 6vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.side h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:40px 0 18px;max-width:12ch}
.side p{color:#c7d1e6;font-size:18px;max-width:42ch;margin:0}
.side .stripe{position:absolute;right:-60px;bottom:60px;width:340px;height:44px;background:repeating-linear-gradient(-45deg,var(--orange) 0 22px,transparent 22px 44px);opacity:.9;transform:rotate(-8deg)}
.side .foot{color:#8794b3;font-size:14px;position:relative}
.main{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.box{width:100%;max-width:420px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:10px 0 4px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.langs{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.mods{display:flex;gap:10px;margin-top:6px}.mods label{flex:1;display:flex;gap:10px;align-items:center;margin:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.mods input{width:22px;height:22px;min-height:0;accent-color:var(--blue)}
.link{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;padding:6px 0;text-decoration:underline}
@media (max-width:820px){.land{grid-template-columns:1fr}.side{padding:28px 20px 34px}.side h1{margin:24px 0 10px}.side .stripe{display:none}}
</style>
</head>
<body>
<div class="land">
  <section class="side">
    <a class="brand" href="/"><i></i>e-freight</a>
    <div><h1 data-t="landingTitle"></h1><p data-t="landingText"></p></div>
    <div class="stripe" aria-hidden="true"></div>
    <div class="foot">e-freight.nl</div>
  </section>
  <section class="main"><div class="box">
    <div class="langs" id="langs"></div>

    <div id="vLogin">
      <h2 data-t="login"></h2>
      <label for="liEmail" data-t="email"></label><input id="liEmail" type="email" autocomplete="email">
      <label for="liPw" data-t="password"></label><input id="liPw" type="password" autocomplete="current-password">
      <button class="btn primary" id="liBtn" data-t="signin"></button>
      <div class="msg" id="liMsg" role="status"></div>
      <button class="link" id="toForgot" data-t="forgot"></button><br>
      <button class="link" id="toSignup" data-t="noAccount"></button>
    </div>

    <div id="vSignup" hidden>
      <h2 data-t="signup"></h2>
      <div class="seg" role="group"><button id="mCreate" aria-pressed="true" data-t="newCompany"></button><button id="mJoin" aria-pressed="false" data-t="joinCompany"></button></div>
      <div id="fCreate"><label for="suCompany" data-t="companyName"></label><input id="suCompany" autocomplete="organization">
        <label data-t="modules"></label>
        <div class="mods"><label><input type="checkbox" id="mUld" checked><span data-t="modUld"></span></label><label><input type="checkbox" id="mNoa" checked><span data-t="modNoa"></span></label></div></div>
      <div id="fJoin" hidden><label for="suCode" data-t="joinCode"></label><input id="suCode" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em"></div>
      <label for="suName" data-t="name"></label><input id="suName" autocomplete="name">
      <label for="suEmail" data-t="email"></label><input id="suEmail" type="email" autocomplete="email">
      <label for="suPw" data-t="password"></label><input id="suPw" type="password" autocomplete="new-password">
      <button class="btn primary" id="suBtn" data-t="signup"></button>
      <div class="msg" id="suMsg" role="status"></div>
      <button class="link" id="toLogin" data-t="haveAccount"></button>
    </div>

    <div id="vForgot" hidden>
      <h2 data-t="forgot"></h2>
      <label for="fgEmail" data-t="email"></label><input id="fgEmail" type="email" autocomplete="email">
      <button class="btn primary" id="fgBtn" data-t="setPassword"></button>
      <div class="msg" id="fgMsg" role="status"></div>
      <button class="link" id="toLogin2" data-t="haveAccount"></button>
    </div>

    <div id="vReset" hidden>
      <h2 data-t="newPassword"></h2>
      <label for="rsPw" data-t="newPassword"></label><input id="rsPw" type="password" autocomplete="new-password">
      <button class="btn primary" id="rsBtn" data-t="setPassword"></button>
      <div class="msg" id="rsMsg" role="status"></div>
    </div>
  </div></section>
</div>
<script src="/ef.js"></script>
<script>
let mode="create";
const view=v=>["vLogin","vSignup","vForgot","vReset"].forEach(x=>$("#"+x).hidden=x!==v);
function drawLangs(){$("#langs").innerHTML=Object.entries(LANGS).map(([k,v])=>`<button data-l="${k}" aria-pressed="${k===LANG}">${v}</button>`).join("")}
$("#langs").onclick=e=>{const b=e.target.closest("[data-l]");if(b){setLang(b.dataset.l);drawLangs()}};
drawLangs();applyI18n();
if(new URLSearchParams(location.search).get("join")){mode="join";$("#suCode").value=new URLSearchParams(location.search).get("join");view("vSignup");setMode()}
function setMode(){$("#mCreate").setAttribute("aria-pressed",mode==="create");$("#mJoin").setAttribute("aria-pressed",mode==="join");$("#fCreate").hidden=mode!=="create";$("#fJoin").hidden=mode!=="join"}
$("#mCreate").onclick=()=>{mode="create";setMode()};$("#mJoin").onclick=()=>{mode="join";setMode()};
$("#toSignup").onclick=()=>view("vSignup");$("#toLogin").onclick=$("#toLogin2").onclick=()=>view("vLogin");$("#toForgot").onclick=()=>view("vForgot");
const msg=(id,k,err=true)=>{$(id).className="msg"+(err?" err":"");$(id).textContent=t(k)};

$("#liBtn").onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$("#liEmail").value.trim(),password:$("#liPw").value});
  if(error)return msg("#liMsg",/confirm/i.test(error.message)?"checkMail":"badLogin");
  location.href="/app.html";
};
$("#liPw").onkeydown=e=>{if(e.key==="Enter")$("#liBtn").click()};
$("#suBtn").onclick=async()=>{
  const email=$("#suEmail").value.trim(),pw=$("#suPw").value,name=$("#suName").value.trim();
  const company=$("#suCompany").value.trim(),code=$("#suCode").value.trim().toUpperCase();
  if(!email||!name||(mode==="create"?!company:!code))return msg("#suMsg","fillAll");
  if(pw.length<8)return msg("#suMsg","pwShort");
  const modules=[$("#mUld").checked&&"uld",$("#mNoa").checked&&"noa"].filter(Boolean);
  if(mode==="create"&&!modules.length)return msg("#suMsg","pickModule");
  $("#suBtn").disabled=true;
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+"/app.html",
    data:{mode,name,lang:LANG,company_name:mode==="create"?company:null,modules:mode==="create"?modules:null,join_code:mode==="join"?code:null}}});
  $("#suBtn").disabled=false;
  if(error)return $("#suMsg").className="msg err",$("#suMsg").textContent=error.message;
  if(data.session)location.href="/app.html";else msg("#suMsg","checkMail",false);
};
$("#fgBtn").onclick=async()=>{
  await sb.auth.resetPasswordForEmail($("#fgEmail").value.trim(),{redirectTo:location.origin+"/"});
  msg("#fgMsg","resetSent",false);
};
$("#rsBtn").onclick=async()=>{
  const pw=$("#rsPw").value;if(pw.length<8)return msg("#rsMsg","pwShort");
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){$("#rsMsg").className="msg err";$("#rsMsg").textContent=error.message;return}
  msg("#rsMsg","pwSet",false);setTimeout(()=>location.href="/app.html",900);
};
let recovering=false;
sb.auth.onAuthStateChange(e=>{if(e==="PASSWORD_RECOVERY"){recovering=true;view("vReset")}});
sb.auth.getSession().then(({data})=>{setTimeout(()=>{if(data.session&&!recovering&&!location.hash.includes("type=recovery"))location.href="/app.html"},300)});
</script>
</body>
</html>
